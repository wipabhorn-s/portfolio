<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wipabhorn Saeyang — Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="portfolio-style-demo.css" />
  </head>
  <body>
    <!-- The page the QR code on the lanyard card opens (see qrUrl in hero-lanyard.js) -->
    <main class="links-page">
      <!-- same starry sky as the hero (hero-sparkle.js) -->
      <canvas class="hero-stars" aria-hidden="true"></canvas>
      <div class="links-card">
        <div class="links-sign" aria-hidden="true">
          Praew<span class="links-star">&#10022;</span>
        </div>
        <h1>Wipabhorn Saeyang</h1>
        <p class="links-role">Full-Stack Developer</p>

        <!-- TODO: replace every YOUR-... below with your own address.
             Delete the whole <li> of any channel you don't use. -->
        <ul class="links-list">
          <li>
            <a
              href="https://www.linkedin.com/in/wipabhorn-s/"
              target="_blank"
              rel="noopener"
            >
              LinkedIn <span>Work history &amp; CV</span>
            </a>
          </li>
          <li>
            <a
              href="https://github.com/wipabhorn-s"
              target="_blank"
              rel="noopener"
            >
              GitHub <span>Code &amp; projects</span>
            </a>
          </li>
          <li>
            <a
              href="https://www.facebook.com/prwts/"
              target="_blank"
              rel="noopener"
            >
              Facebook <span>Say hi</span>
            </a>
          </li>
          <li>
            <a href="https://line.me/ti/p/~prwzn" target="_blank" rel="noopener">
              LINE <span>Chat with me</span>
            </a>
          </li>
          <li class="links-row">
            <a href="mailto:wipabhorn26@gmail.com">
              Email <span>wipabhorn26@gmail.com</span>
            </a>
            <!-- copy icon inside the pill: copies data-copy to the clipboard
                 (copy-button.js); shows a tick when done -->
            <button class="links-copy" type="button" data-copy="wipabhorn26@gmail.com" aria-label="Copy email address" title="Copy email address">
              <svg class="icon-copy" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2" />
                <path d="M5 15V6a2 2 0 0 1 2-2h9" />
              </svg>
              <svg class="icon-done" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12.5l4.5 4.5L19 7.5" />
              </svg>
            </button>
          </li>
        </ul>

        <a class="btn-pill links-back" href="portfolio-style-demo.html"
          >View my portfolio</a
        >
      </div>
    </main>
    <script src="hero-sparkle.js"></script>
    <script src="copy-button.js"></script>
  </body>
</html>
